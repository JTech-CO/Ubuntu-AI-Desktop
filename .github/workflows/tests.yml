name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Ubuntu 24.04 is also the reference: its mawk 1.3.4 and jq 1.7.1 are
    # the programs the emulator imitates.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Unit tests
        run: node --test "tests/*.test.mjs"

      - name: Compare with the real mawk, jq, tar, gzip and unzip
        # Informational: a difference is worth reading, not a broken build.
        continue-on-error: true
        env:
          UAD_AWK: /usr/bin/mawk
          UAD_JQ: /usr/bin/jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mawk jq zip unzip
          /usr/bin/jq --version
          dpkg -S /usr/bin/jq /usr/bin/mawk || true
          dpkg-query -W jq mawk || true
          node tests/differential.mjs
